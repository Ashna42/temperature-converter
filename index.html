<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Temperature Converter</h1>
    <label for="from_temp">From:</label>
    <select name="from_temp" id="from_temp">
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
        <option value="kelvin">Kelvin</option>
    </select>   
    <br><br> 
    <label for="to_temp">To:</label>
    <select name="to_temp" id="to_temp">
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
        <option value="kelvin">Kelvin</option>
    </select>
    <br><br>     
    <label for="temperature">Temperature</label>
    <input type="number" placeholder="Enter Temperature"id="temperature">
    <button type="submit" onclick="temperature()">CALCULATE</button>
    <script src="script.js"></script>
    <p id="resultant_temperature">Temperature:</p>
</div>
</body>
</html>
